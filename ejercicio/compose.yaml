version: '3.8'

services:
  # Servicio PostgreSQL - Base de datos para SonarQube
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-postgres
    environment:
      # Variables de entorno para PostgreSQL
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonarpass
      POSTGRES_DB: sonarqube
    volumes:
      # Volumen para persistir los datos de PostgreSQL
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - sonarqube-network
    healthcheck:
      # Healthcheck para verificar que PostgreSQL está funcionando
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Servicio SonarQube
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      # Variables de entorno para conectar SonarQube con PostgreSQL
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonarpass
    ports:
      # Mapeo del puerto 9000 para acceder desde el host
      - "9000:9000"
    volumes:
      # Volúmenes necesarios para persistir datos de SonarQube
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarqube-network
    healthcheck:
      # Healthcheck para verificar que SonarQube está funcionando
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # Configuraciones adicionales requeridas por SonarQube
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096

# Definición de volúmenes
volumes:
  postgresql_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

# Red de tipo bridge
networks:
  sonarqube-network:
    driver: bridge